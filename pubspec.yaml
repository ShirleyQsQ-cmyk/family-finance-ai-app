name: family_app_ai
description: "A Flutter AI family financial planning prototype."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/family_finance_model.json
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#7357F6"
    theme_color: "#7357F6"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"